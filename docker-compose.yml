services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DEMOGRAFIA_CSV_URL=${DEMOGRAFIA_CSV_URL:-}
        - DEFAULT_DOCS_URL=${DEFAULT_DOCS_URL:-}
    image: automatic-reporting
    container_name: automatic-reporting-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist generated HTML/PDF/PNGs
      - ./output:/app/output