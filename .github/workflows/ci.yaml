name: CI for building

on: [push, pull_request, milestone, release]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies + Ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build SSR bundle
        run: |
          npm ci
          npm run build -w report

      - name: Start API
        run: |
          mkdir -p output
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5
      - name: Check API health
        run: |
          curl --fail http://localhost:8000/cities
      - name: Lint with Ruff
        run: |
          python -m ruff check .
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -w frontend
      