name: CI for building

on: [push, pull_request, milestone, release]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12]

    steps:
      - uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies + Ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build SSR bundle
        run: |
          npm install
          npm run build -w report

      - name: Start API and check health
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          for i in {1..15}; do
            if curl --fail --silent http://localhost:8000/cities > /dev/null; then
              echo "API is up"
              exit 0
            fi
            echo "Attempt $i: not ready yet"
            sleep 2
          done
          echo "API did not start in time"
          cat uvicorn.log
          exit 1
      - name: Lint with Ruff
        run: |
          python -m ruff check .
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build -w frontend
      